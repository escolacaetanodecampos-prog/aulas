name: Publicar site completo no GitHub Pages

on:
  push:
    branches:
      - main
      - desempenho-v2
    paths:
      - 'index.html'
      - '404.html'
      - '.nojekyll'
      - 'simulador-rh-mvp/**'
      - 'simulador-desempenho/**'
      - 'rh/**'
      - 'desempenho/**'
      - 'gestao-desempenho/**'
      - 'simulador-gestao-desempenho/**'
      - 'simulador-rh/**'
      - '.github/workflows/simulador-rh-pages.yml'
      - '.github/workflows/desempenho-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RH (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main

      - name: Checkout desempenho-v2
        uses: actions/checkout@v4
        with:
          ref: desempenho-v2
          path: _desempenho_branch

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble complete site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          # RH: fonte oficial = main.
          cp -R _main/simulador-rh-mvp/. _site/
          mkdir -p _site/simulador-rh-mvp
          cp -R _main/simulador-rh-mvp/. _site/simulador-rh-mvp/

          # Portal de entrada e rotas estáveis: fonte oficial = main.
          cp _main/index.html _site/index.html
          cp _main/404.html _site/404.html
          cp _main/.nojekyll _site/.nojekyll
          mkdir -p _site/gestao-desempenho _site/simulador-gestao-desempenho _site/simulador-rh
          cp -R _main/gestao-desempenho/. _site/gestao-desempenho/
          cp -R _main/simulador-gestao-desempenho/. _site/simulador-gestao-desempenho/
          cp -R _main/simulador-rh/. _site/simulador-rh/

          # Gestão de Desempenho: fonte oficial = desempenho-v2.
          mkdir -p _site/simulador-desempenho
          cp -R _desempenho_branch/simulador-desempenho/. _site/simulador-desempenho/

          # Rotas auxiliares preservadas.
          mkdir -p _site/rh _site/desempenho
          cp -R _desempenho_branch/rh/. _site/rh/
          cp -R _desempenho_branch/desempenho/. _site/desempenho/

          # Validação obrigatória antes da publicação.
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/.nojekyll
          test -f _site/simulador-rh-mvp/index.html
          test -f _site/simulador-desempenho/index.html
          test -f _site/rh/index.html
          test -f _site/desempenho/index.html
          test -f _site/gestao-desempenho/index.html
          test -f _site/simulador-gestao-desempenho/index.html
          test -f _site/simulador-rh/index.html

          echo "=== SITE MONTADO ==="
          find _site -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
