<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Professor — Simulador RH</title><link rel="stylesheet" href="style.css"></head><body><header><b>PAINEL DO PROFESSOR</b><span>Resultados do Simulador RH</span></header><main><section class="card"><h1>Consolidar resultados</h1><p>Depois das atividades, selecione os arquivos JSON exportados pelos estudantes. O painel calcula uma visão consolidada sem enviar os dados para um servidor.</p><input id="files" type="file" accept=".json" multiple><div id="out"></div></section></main><script>
document.querySelector("#files").onchange=async function(e){const data=[];for(const f of e.target.files){try{data.push(JSON.parse(await f.text()))}catch(err){}}if(!data.length)return;let sums={d1:0,d2:0,d3:0};data.forEach(x=>{sums.d1+=x.pontuacao?.d1||0;sums.d2+=x.pontuacao?.d2||0;sums.d3+=x.pontuacao?.d3||0});const n=data.length;document.querySelector("#out").innerHTML="<h2>"+n+" participantes</h2><div class='grid'><div class='notice'><div class='score'>"+Math.round(sums.d1/n)+"%</div>Descritor 1 — Recrutamento/Seleção</div><div class='notice'><div class='score'>"+Math.round(sums.d2/n)+"%</div>Descritor 2 — CHA</div><div class='notice'><div class='score'>"+Math.round(sums.d3/n)+"%</div>Descritor 3 — T&D</div></div><h2>Registros</h2><table><tr><th>Participante</th><th>Turma</th><th>D1</th><th>D2</th><th>D3</th><th>Contratado</th></tr>"+data.map(x=>"<tr><td>"+x.participante+"</td><td>"+x.turma+"</td><td>"+(x.pontuacao?.d1||0)+"%</td><td>"+(x.pontuacao?.d2||0)+"%</td><td>"+(x.pontuacao?.d3||0)+"%</td><td>"+x.contratado+"</td></tr>").join("")+"</table>"};
</script></body></html>
